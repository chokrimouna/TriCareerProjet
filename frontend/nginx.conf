server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des fichiers statiques
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single Page Application : toutes les routes inconnues renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mise en cache longue des assets versionnés (hash dans le nom de fichier)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
